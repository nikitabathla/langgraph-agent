<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f6;
        --panel: #ffffff;
        --text: #1c2430;
        --muted: #6a7585;
        --border: #e3e8ef;
        --user: #1d4e89;
        --user-soft: #1d4e89;
        --agent: #f7f9fc;
        --accent: #1d4e89;
        --accent-hover: #163c6b;
        --shadow: 0 10px 30px rgba(28, 36, 48, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", system-ui, sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, #dbe7f6 0%, transparent 55%),
          radial-gradient(900px 400px at 100% 0%, #e7eef7 0%, transparent 50%),
          var(--bg);
        color: var(--text);
      }

      .app {
        max-width: 850px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1.25rem 1.25rem;
      }

      header {
        margin-bottom: 1rem;
      }

      header h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      header .subtitle {
        margin: 0.2rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        padding: 1.15rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        margin-bottom: 0.9rem;
        min-height: 52vh;
        box-shadow: var(--shadow);
      }

      #messages.has-chat .empty-state {
        display: none;
      }

      .empty-state {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: var(--muted);
        font-size: 0.98rem;
        gap: 0.85rem;
        padding: 1rem;
      }

      .empty-state svg {
        width: 140px;
        height: 140px;
      }

      .empty-state p {
        margin: 0;
      }

      .msg {
        max-width: 86%;
        padding: 0.8rem 1rem;
        border-radius: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.98rem;
      }

      .msg.user {
        align-self: flex-end;
        background: linear-gradient(180deg, #245ca0 0%, var(--user) 100%);
        color: #fff;
        border-bottom-right-radius: 6px;
        box-shadow: 0 6px 14px rgba(29, 78, 137, 0.2);
      }

      .msg.agent {
        align-self: flex-start;
        background: var(--agent);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
      }

      .msg.error {
        align-self: stretch;
        background: #fff1f1;
        color: #8f2a2a;
        border: 1px solid #f3c7c7;
        max-width: 100%;
      }

      .msg.agent table {
        border-collapse: collapse;
        margin: 0.55rem 0;
        font-size: 0.9rem;
        width: 100%;
        overflow: hidden;
        border-radius: 10px;
        background: #fff;
      }

      .msg.agent th,
      .msg.agent td {
        border: 1px solid var(--border);
        padding: 0.4rem 0.55rem;
        text-align: left;
      }

      .msg.agent th {
        background: #eef3f9;
        font-weight: 600;
      }

      .msg.agent a {
        color: var(--accent);
      }

      .msg.agent strong {
        font-weight: 650;
      }

      form {
        display: flex;
        gap: 0.6rem;
        padding: 0.45rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      input {
        flex: 1;
        padding: 0.8rem 0.85rem;
        border: none;
        border-radius: 12px;
        font: inherit;
        background: transparent;
        outline: none;
      }

      input::placeholder {
        color: #93a0b0;
      }

      button {
        padding: 0.75rem 1.2rem;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #d5deea;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      .msg.loading {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Custom Agent</h1>
        <p class="subtitle">Ask questions. Answers stay in this thread.</p>
      </header>

      <div id="messages">
        <div class="empty-state">
          <p>Ask a question to start the conversation.</p>
          <svg viewBox="0 0 140 140" fill="none" aria-hidden="true">
            <circle cx="70" cy="70" r="62" fill="#eef4fb" />
            <rect
              x="28"
              y="38"
              width="84"
              height="58"
              rx="16"
              fill="#fff"
              stroke="#c5d4e8"
              stroke-width="2"
            />
            <path d="M52 96l8-10h20" fill="#fff" stroke="#c5d4e8" stroke-width="2" stroke-linejoin="round" />
            <circle cx="56" cy="64" r="5" fill="#1d4e89" />
            <circle cx="70" cy="64" r="5" fill="#1d4e89" />
            <circle cx="84" cy="64" r="5" fill="#1d4e89" />
            <rect x="58" y="26" width="24" height="10" rx="5" fill="#1d4e89" />
          </svg>
        </div>
      </div>

      <form id="form">
        <input
          id="question"
          type="text"
          placeholder="Ask something…"
          autocomplete="off"
          required
        />
        <button type="submit" id="send">Ask</button>
      </form>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("question");
      const sendBtn = document.getElementById("send");

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      // Tiny markdown: bold + pipe tables. Enough for agent answers.
      function renderMarkdown(text) {
        const escaped = escapeHtml(text);
        const lines = escaped.split("\n");
        let html = "";
        let inTable = false;

        for (const line of lines) {
          const isSeparator = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(
            line
          );
          const isTableRow = line.trim().startsWith("|") && line.includes("|");

          if (isTableRow && !isSeparator) {
            const cells = line
              .trim()
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((c) => c.trim());
            if (!inTable) {
              html += "<table>";
              inTable = true;
              html +=
                "<tr>" +
                cells.map((c) => `<th>${formatInline(c)}</th>`).join("") +
                "</tr>";
            } else {
              html +=
                "<tr>" +
                cells.map((c) => `<td>${formatInline(c)}</td>`).join("") +
                "</tr>";
            }
            continue;
          }

          if (isSeparator) continue;

          if (inTable) {
            html += "</table>";
            inTable = false;
          }

          html += formatInline(line) + "\n";
        }

        if (inTable) html += "</table>";
        return html;
      }

      function formatInline(text) {
        return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      }

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        if (role === "agent") {
          div.innerHTML = renderMarkdown(text);
        } else {
          div.textContent = text;
        }
        messagesEl.classList.add("has-chat");
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function addSpinner() {
        const div = document.createElement("div");
        div.className = "msg agent loading";
        div.innerHTML = '<span class="spinner"></span><span>Thinking…</span>';
        messagesEl.classList.add("has-chat");
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        addMessage("user", question);
        input.value = "";
        sendBtn.disabled = true;
        const spinner = addSpinner();

        try {
          const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
          });
          const data = await res.json();
          spinner.remove();
          if (!res.ok) {
            throw new Error(data.error || "Request failed");
          }
          addMessage("agent", data.result || "(empty response)");
        } catch (err) {
          spinner.remove();
          addMessage("error", err.message || String(err));
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });

      input.focus();
    </script>
  </body>
</html>
